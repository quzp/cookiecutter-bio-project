[workspace]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = ["{{ cookiecutter.author_name }} <{{ cookiecutter.author_email }}>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# Requires pixi >= 0.40. Install: curl -fsSL https://pixi.sh/install.sh | bash
# Add dependencies with `pixi add <pkg>`; it updates this file and pixi.lock.
# Commit pixi.lock - it is what makes the environment reproducible.

[dependencies]
{% if cookiecutter.primary_language in ["R", "R + Python"] %}r-base = ">=4.4"
r-tidyverse = "*"
r-here = "*"            # use here::here() so scripts run from any working directory
r-data-table = "*"
r-yaml = "*"
r-sessioninfo = "*"
{% endif %}{% if cookiecutter.primary_language in ["Python", "R + Python"] %}python = ">=3.11"
pandas = "*"
numpy = "*"
matplotlib = "*"
pyyaml = "*"
{% endif %}{% if cookiecutter.use_quarto == "yes" %}quarto = "*"
{% endif %}
# Common bioinformatics packages - uncomment as needed, or use `pixi add`
# bioconductor-deseq2 = "*"
# bioconductor-clusterprofiler = "*"
# bioconductor-complexheatmap = "*"
# samtools = "*"
# fastqc = "*"
# multiqc = "*"

[tasks]
{% if cookiecutter.primary_language in ["R", "R + Python"] %}check = "Rscript -e 'sessioninfo::session_info()'"
{% else %}check = "python -c 'import sys, pandas; print(sys.version); print(pandas.__version__)'"
{% endif %}{% if cookiecutter.use_quarto == "yes" %}render = "quarto render src/notebooks"
{% endif %}
